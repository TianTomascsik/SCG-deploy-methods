# SCG TPROXY Transparent Proxy Demo
#
# Four containers showing the full transparent encrypt/decrypt pipeline:
#
#   client ──plain──→ gw-encrypt ══TLS══→ gw-decrypt ──plain──→ server
#   (172.30.1.10)     (172.30.1.1 /       (172.30.0.2 /         (172.30.2.10)
#                      172.30.0.1)         172.30.2.1)
#
# gw-encrypt: intercepts outbound traffic from the client via iptables REDIRECT
#             and TLS-wraps it before forwarding to gw-decrypt.
#
# gw-decrypt: intercepts inbound TLS traffic via TPROXY, decrypts it, and
#             delivers the original plaintext to the server.
#
# Both gateways self-configure their iptables rules from the mounted config.
# To change what port is intercepted, edit configs/gateway-encrypt.json and
# configs/gateway-decrypt.json (the match_dports field).
#
# Usage:
#   docker compose up --build -d
#   docker exec tproxy_client curl -s http://172.30.2.10:8080
#   docker logs tproxy_gw_encrypt
#   docker logs tproxy_gw_decrypt
#   docker compose down

services:
  server:
    image: nginx:alpine
    container_name: tproxy_server
    networks:
      server_net:
        ipv4_address: 172.30.2.10
    command: >
      sh -c "echo 'server { listen 8080; location / { return 200 \"hello from server\\n\"; } }' > /etc/nginx/conf.d/default.conf &&
             ip route replace 172.30.1.0/24 via 172.30.2.1 2>/dev/null || true &&
             nginx -g 'daemon off;'"
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      retries: 10

  gw-decrypt:
    build:
      context: ../../..
      dockerfile: SCG-deploy-methods/container/Dockerfile.production
    container_name: tproxy_gw_decrypt
    depends_on:
      server:
        condition: service_healthy
    networks:
      transit_net:
        ipv4_address: 172.30.0.2
      server_net:
        ipv4_address: 172.30.2.1
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./configs/gateway-decrypt.json:/etc/scg/gateway.json:ro
      - ./entrypoint.sh:/app/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/app/entrypoint.sh"]
    environment:
      - GATEWAY_CONFIG=/etc/scg/gateway.json
      # Route back to client subnet via gw-encrypt on transit net.
      - EXTRA_ROUTES=172.30.1.0/24 via 172.30.0.1

  gw-encrypt:
    build:
      context: ../../..
      dockerfile: SCG-deploy-methods/container/Dockerfile.production
    container_name: tproxy_gw_encrypt
    depends_on:
      - gw-decrypt
    networks:
      client_net:
        ipv4_address: 172.30.1.1
      transit_net:
        ipv4_address: 172.30.0.1
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./configs/gateway-encrypt.json:/etc/scg/gateway.json:ro
      - ./entrypoint.sh:/app/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/app/entrypoint.sh"]
    environment:
      - GATEWAY_CONFIG=/etc/scg/gateway.json
      # Route to server subnet via gw-decrypt on transit net.
      - EXTRA_ROUTES=172.30.2.0/24 via 172.30.0.2

  client:
    image: alpine:latest
    container_name: tproxy_client
    depends_on:
      - gw-encrypt
    networks:
      client_net:
        ipv4_address: 172.30.1.10
    entrypoint: >
      sh -c "apk add --no-cache curl >/dev/null 2>&1;
             ip route replace 172.30.2.0/24 via 172.30.1.1;
             echo 'Routes configured — traffic to server routes via gw-encrypt';
             sleep infinity"
    cap_add:
      - NET_ADMIN

networks:
  client_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/24
  transit_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  server_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.2.0/24

