# 3-Container Gateway Benchmark — Receiver-Decrypt with Downstream
# Container 1: Gateway - accepts TLS/kTLS, decrypts, forwards to downstream
# Container 2: Benchmark runner (sender) - sends data encrypted via TLS/kTLS to gateway
# Container 3: Downstream - receives forwarded plain TCP/UDP data, measures e2e latency
#
# Data flow:  Sender --[TLS/kTLS]--> Gateway (decrypt) --[TCP/UDP]--> Downstream
#
# Usage:
#   PIPE_MODE=tls FORWARD_PROTO=tcp docker compose -f container/docker-compose.gw3c.yml up --build
#   PIPE_MODE=ktls FORWARD_PROTO=udp docker compose -f container/docker-compose.gw3c.yml up --build
#
# Environment variables:
#   BENCHMARKS       - Space-separated list (default: "tcp_raw udp_raw")
#   PIPE_MODE        - tls or ktls — encryption on sender side (default: tls)
#   DECRYPT_MODE     - tls or ktls — decryption mode on gateway (default: same as PIPE_MODE)
#   FORWARD_PROTO    - tcp or udp — protocol for gateway→downstream forwarding (default: tcp)
#   MEASURE_LATENCY  - 1 to enable (default: 0)
#   RUN_ID           - Run identifier (default: auto-generated timestamp)

services:
  downstream:
    build:
      context: ../..
      dockerfile: SCG-deploy-methods/container/Dockerfile
    entrypoint: /usr/local/bin/entrypoint_downstream.sh
    container_name: bench_gw3c_downstream
    networks:
      bench_net:
        aliases:
          - downstream
    privileged: true
    environment:
      - DOWNSTREAM_PORT=${DOWNSTREAM_PORT:-9444}
      - LOG_DIR=/results
      - RUN_ID=${RUN_ID:-}
      - MEASURE_LATENCY=${MEASURE_LATENCY:-0}
      - EXPECTED_TESTS=${EXPECTED_TESTS:-0}
    volumes:
      - bench_results:/results

  gateway:
    build:
      context: ../..
      dockerfile: SCG-deploy-methods/container/Dockerfile
    entrypoint: /usr/local/bin/entrypoint_gateway.sh
    container_name: bench_gw3c_gateway
    depends_on:
      - downstream
    networks:
      bench_net:
        aliases:
          - gateway
    privileged: true
    environment:
      - GATEWAY_PORT=${GATEWAY_PORT:-9443}
      - DECRYPT_MODE=${DECRYPT_MODE:-${PIPE_MODE:-tls}}
      - FORWARD_TARGET=downstream:${DOWNSTREAM_PORT:-9444}
      - FORWARD_PROTO=${FORWARD_PROTO:-tcp}
      - LOG_DIR=/results
      - RUN_ID=${RUN_ID:-}
      - MEASURE_LATENCY=${MEASURE_LATENCY:-0}
      - EXPECTED_TESTS=${EXPECTED_TESTS:-0}
    volumes:
      - bench_results:/results

  benchmark:
    build:
      context: ../..
      dockerfile: SCG-deploy-methods/container/Dockerfile
    entrypoint: /usr/local/bin/entrypoint_benchmark.sh
    container_name: bench_gw3c_runner
    depends_on:
      - gateway
    networks:
      - bench_net
    privileged: true
    shm_size: 256m
    environment:
      - RECEIVER_HOST=gateway
      - RECEIVER_PORT=${GATEWAY_PORT:-9443}
      - BENCHMARKS=${BENCHMARKS:-tcp_raw udp_raw}
      - PIPE_MODE=${PIPE_MODE:-tls}
      - KTLS_THREADS=${KTLS_THREADS:-1}
      - TLS_THREADS=${TLS_THREADS:-1}
      - MEASURE_LATENCY=${MEASURE_LATENCY:-0}
      - LOG_DIR=/results
      - RUN_ID=${RUN_ID:-}
      - INSTANCE=${INSTANCE:-0}
      - TCP_CORK=${TCP_CORK:-0}
    volumes:
      - bench_results:/results

networks:
  bench_net:
    driver: bridge

volumes:
  bench_results:
